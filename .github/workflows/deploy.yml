name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      TF_VAR_jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
      TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # TEMPORARY: remove once the AWS sign-in works.
      - name: Debug sign-in values
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ "$ROLE" = "arn:aws:iam::937492565038:role/github-deploy-ticket-triage" ]; then
            echo "Secret check: match"
          else
            echo "Secret check: MISMATCH (length ${#ROLE})"
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | python3 -c "import sys,json,base64; p=sys.stdin.read().strip().split('.')[1]; p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print({k:d.get(k) for k in ['sub','aud','repository','ref']})"

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.10.0"

      - name: Initialise
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Deploy
        run: terraform apply -auto-approve